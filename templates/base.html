<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NPB Stats DB{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f5f5f5; }

    /* テーブル横スクロール */
    .table-scroll { overflow-x: auto; border-radius: 4px; }

    /* セル省スペース */
    .stats-table th,
    .stats-table td { white-space: nowrap; font-size: 0.82rem; padding: 0.3rem 0.6rem; }

    /* ヘッダー固定 */
    .stats-table thead th {
      position: sticky;
      top: 0;
      background-color: #212529;
      color: #fff;
      z-index: 2;
    }

    /* 1列目（チーム/選手名）を左固定 */
    .stats-table th:first-child,
    .stats-table td:first-child {
      position: sticky;
      left: 0;
      z-index: 1;
      background-color: #f8f9fa;
    }
    .stats-table thead th:first-child {
      background-color: #212529;
      z-index: 3;
    }

    .page-controls { gap: 0.5rem; }

    /* ソート可能ヘッダー */
    .stats-table thead th { cursor: pointer; user-select: none; }
    .stats-table thead th:hover { background-color: #343a40; }
    .stats-table thead th[data-sort-dir="asc"]::after  { content: " \2191"; font-size: 0.75em; }
    .stats-table thead th[data-sort-dir="desc"]::after { content: " \2193"; font-size: 0.75em; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="/">NPB Stats</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav">
          {% for key, href, label in nav_items %}
          <li class="nav-item">
            <a class="nav-link {% if page == key %}active fw-semibold{% endif %}"
               href="{{ href }}">{{ label }}</a>
          </li>
          {% endfor %}
        </ul>
      </div>
    </div>
  </nav>

  <div class="container-fluid py-3 px-3">
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('.stats-table').forEach(function (table) {
      var ths = table.querySelectorAll('thead th');
      ths.forEach(function (th, colIdx) {
        th.addEventListener('click', function () {
          var asc = th.dataset.sortDir !== 'asc';
          ths.forEach(function (h) { h.dataset.sortDir = ''; });
          th.dataset.sortDir = asc ? 'asc' : 'desc';

          var tbody = table.querySelector('tbody');
          var rows = Array.from(tbody.querySelectorAll('tr'));
          rows.sort(function (a, b) {
            var av = (a.cells[colIdx] || {textContent: ''}).textContent.trim();
            var bv = (b.cells[colIdx] || {textContent: ''}).textContent.trim();
            if (av === '-') return 1;   // 欠損値は常に末尾
            if (bv === '-') return -1;
            var an = parseFloat(av);
            var bn = parseFloat(bv);
            if (!isNaN(an) && !isNaN(bn)) return asc ? an - bn : bn - an;
            return asc
              ? av.localeCompare(bv, 'ja')
              : bv.localeCompare(av, 'ja');
          });
          rows.forEach(function (r) { tbody.appendChild(r); });
        });
      });
    });
  });
  </script>
</body>
</html>
